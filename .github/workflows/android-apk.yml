name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      flutter_channel:
        description: 'Flutter release channel'
        required: false
        default: 'stable'
        type: choice
        options:
          - 'stable'
          - 'beta'
      create_release:
        description: 'Publish APK to GitHub Releases'
        required: false
        default: true
        type: boolean
      tag_name:
        description: 'Custom release tag name (e.g. v1.0.0-android). Leave blank to auto-generate'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build Universal Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: nada-zikr

    steps:
      # ─────────────────────────────────────────────────────────────────────────
      # 1. Checkout Repository
      # ─────────────────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────────────────
      # 2. Extract Version Metadata
      # ─────────────────────────────────────────────────────────────────────────
      - name: Resolve App Version & Build Number
        id: meta
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //g' | tr -d '[:space:]')
          VERSION_NAME=$(echo "$PUBSPEC_VERSION" | cut -d'+' -f1)
          BUILD_NUM=$(echo "$PUBSPEC_VERSION" | cut -d'+' -f2)

          INPUT_TAG="${{ github.event.inputs.tag_name }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VERSION_NAME}-build.${BUILD_NUM}-android"
          fi

          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "build_num=$BUILD_NUM" >> $GITHUB_OUTPUT
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT

          echo "=================================================="
          echo " App Version: $VERSION_NAME (Build $BUILD_NUM)"
          echo " Release Tag: $TAG"
          echo "=================================================="

      # ─────────────────────────────────────────────────────────────────────────
      # 3. Setup Java & Flutter
      # ─────────────────────────────────────────────────────────────────────────
      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ github.event.inputs.flutter_channel || 'stable' }}
          cache: true

      - name: Validate Flutter Environment
        run: |
          flutter --version
          flutter doctor -v

      - name: Install Flutter Dependencies
        run: flutter pub get

      # ─────────────────────────────────────────────────────────────────────────
      # 4. Setup Release Signing (Optional)
      # ─────────────────────────────────────────────────────────────────────────
      - name: Decode Keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # ─────────────────────────────────────────────────────────────────────────
      # 5. Build Universal APK
      # ─────────────────────────────────────────────────────────────────────────
      - name: Build APK (Release)
        run: |
          flutter build apk \
            --release

      - name: Verify APK
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK not found at $APK_PATH"
            exit 1
          fi
          echo "APK built successfully."

      # ─────────────────────────────────────────────────────────────────────────
      # 6. Rename & Checksum
      # ─────────────────────────────────────────────────────────────────────────
      - name: Rename & Generate Checksums
        run: |
          set -e
          APK_SOURCE="build/app/outputs/flutter-apk/app-release.apk"
          APK_NAME="Nada-Zikr-v${{ steps.meta.outputs.version_name }}.apk"

          cp "$APK_SOURCE" "$APK_NAME"

          APK_SIZE=$(ls -lh "$APK_NAME" | awk '{print $5}')
          APK_SHA=$(shasum -a 256 "$APK_NAME" | awk '{print $1}')

          echo "apk_name=$APK_NAME" >> $GITHUB_ENV
          echo "apk_size=$APK_SIZE" >> $GITHUB_ENV
          echo "apk_sha=$APK_SHA" >> $GITHUB_ENV

          echo "=================================================="
          echo " APK: $APK_NAME"
          echo " Size: $APK_SIZE"
          echo " SHA256: $APK_SHA"
          echo "=================================================="

      # ─────────────────────────────────────────────────────────────────────────
      # 7. Upload APK as GitHub Actions Artifact
      # ─────────────────────────────────────────────────────────────────────────
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nada-Zikr-Android-APK
          path: nada-zikr/${{ env.apk_name }}
          retention-days: 30
          if-no-files-found: error

      # ─────────────────────────────────────────────────────────────────────────
      # 8. Publish to GitHub Releases
      # ─────────────────────────────────────────────────────────────────────────
      - name: Publish GitHub Release
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true') || github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: "Nada Dhikr Android (${{ steps.meta.outputs.release_tag }})"
          draft: false
          prerelease: false
          make_latest: false
          generate_release_notes: false
          body: |
            ## 📱 Nada Dhikr - Android APK (${{ steps.meta.outputs.release_tag }})

            Universal APK ready for direct install on any Android device!

            ---

            ### 📦 Download

            | Package | Size | SHA256 |
            | :--- | :--- | :--- |
            | **`${{ env.apk_name }}`** | `${{ env.apk_size }}` | `${{ env.apk_sha }}` |

            ---

            ### 🚀 Installation Guide

            #### 📲 Option 1: Direct Download (Easiest)
            1. Open this Release page in **Chrome** on your Android phone.
            2. Tap **`${{ env.apk_name }}`** to download.
            3. When prompted, tap **Install** (you may need to enable "Install from unknown sources" in Settings).

            #### 💻 Option 2: Transfer from PC
            1. Download the APK to your computer.
            2. Connect your Android device via USB.
            3. Copy the `.apk` file to your device's **Downloads** folder.
            4. Open a file manager on your phone and tap the APK to install.

            #### ✅ Option 3: ADB Install
            ```bash
            adb install ${{ env.apk_name }}
            ```
          files: |
            nada-zikr/${{ env.apk_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────────────────────────────────────
      # 9. GitHub Actions Job Step Summary
      # ─────────────────────────────────────────────────────────────────────────
      - name: Generate Actions Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # 🎉 Android APK Build Complete!

          ### 📦 Built APK
          - **`${{ env.apk_name }}`** (${{ env.apk_size }}): Universal release APK for all Android devices.

          ### 🔑 SHA256 Checksum
          ```text
          ${{ env.apk_sha }}
          ```

          ### 📲 How to Install
          1. **Direct Download**: Open this page on your Android phone and download the APK.
          2. **USB Transfer**: Copy the APK to your device and tap to install.
          3. **ADB**: Run `adb install ${{ env.apk_name }}`
          EOF
