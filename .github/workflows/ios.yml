name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build Mode (unsigned for sideloading/testing, or signed for App Store)'
        required: true
        default: 'unsigned'
        type: choice
        options:
          - unsigned
          - signed
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Extract App Version
        id: app_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //g')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      # ─────────────────────────────────────────────────────────────────────────────
      # PATH 1: SIGNED BUILD (Requires Apple Developer Secrets)
      # ─────────────────────────────────────────────────────────────────────────────
      - name: Install Apple Certificate and Provisioning Profiles (Signed Mode)
        if: ${{ inputs.build_mode == 'signed' || (github.event_name != 'workflow_dispatch' && env.APPLE_CERTIFICATE != '') }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          WIDGET_PROVISION_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary_ci_password' }}
        run: |
          # Create temporary keychain
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          WIDGET_PP_PATH=$RUNNER_TEMP/widget_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          echo -n "$WIDGET_PROVISION_PROFILE_BASE64" | base64 --decode -o $WIDGET_PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Place provisioning profiles in Library
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
          cp $WIDGET_PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build Signed IPA
        if: ${{ inputs.build_mode == 'signed' }}
        run: |
          flutter build ipa --release

      # ─────────────────────────────────────────────────────────────────────────────
      # PATH 2: SIDELOADER OPTIMIZED IPA (Sideloadly, AltStore, TrollStore, Scarlet)
      # ─────────────────────────────────────────────────────────────────────────────
      - name: Build Unsigned iOS Archive
        if: ${{ inputs.build_mode == 'unsigned' || github.event_name == 'push' }}
        run: |
          cd ios
          pod install --repo-update
          cd ..
          flutter build ios --release --no-codesign

      - name: Package Sideload-Ready IPAs
        if: ${{ inputs.build_mode == 'unsigned' || github.event_name == 'push' }}
        run: |
          mkdir -p build/ios/ipa
          APP_PATH="build/ios/iphoneos/Runner.app"

          # 1. Package Complete IPA (With PrayerTimesWidget extension)
          mkdir -p build/ios/ipa/full_payload/Payload
          ditto "$APP_PATH" build/ios/ipa/full_payload/Payload/Runner.app
          cd build/ios/ipa/full_payload
          zip -r -y "../Nada-Zikr-Full-v${{ steps.app_version.outputs.VERSION }}.ipa" Payload
          cd ../../../..

          # 2. Package Sideload-Safe IPA (Stripped PlugIns for Free 7-day Apple IDs in Sideloadly/AltStore)
          mkdir -p build/ios/ipa/safe_payload/Payload
          ditto "$APP_PATH" build/ios/ipa/safe_payload/Payload/Runner.app
          rm -rf build/ios/ipa/safe_payload/Payload/Runner.app/PlugIns
          cd build/ios/ipa/safe_payload
          zip -r -y "../Nada-Zikr-SideloadSafe-v${{ steps.app_version.outputs.VERSION }}.ipa" Payload
          cd ../../../..

          # Cleanup temp payload folders
          rm -rf build/ios/ipa/full_payload build/ios/ipa/safe_payload

          echo "Generated IPAs:"
          ls -lh build/ios/ipa/

      # ─────────────────────────────────────────────────────────────────────────────
      # ARTIFACT UPLOAD: Downloadable right from GitHub Actions summary
      # ─────────────────────────────────────────────────────────────────────────────
      - name: Upload IPA Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nada-iOS-IPAs-v${{ steps.app_version.outputs.VERSION }}
          path: |
            build/ios/ipa/*.ipa
            build/ios/archive/*.ipa
          retention-days: 14
          
