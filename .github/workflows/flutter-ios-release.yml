name: iOS Release (App Store / TestFlight)

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Marketing version name override (e.g. 1.0.0). Leave blank to use pubspec.yaml'
        required: false
        default: ''
        type: string
      build_number:
        description: 'Build number override (e.g. 5). Leave blank to use pubspec.yaml'
        required: false
        default: ''
        type: string
      upload_testflight:
        description: 'Upload directly to TestFlight after successful build (requires APPSTORE_* secrets)'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    name: Build iOS Release Package
    runs-on: macos-14

    defaults:
      run:
        working-directory: nada-zikr

    steps:
      # ─────────────────────────────────────────────────────────────────────────
      # 1. Checkout repository
      # ─────────────────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────────────────
      # 2. Check for Apple Secrets (Signed CI Mode vs Direct Release Mode)
      # ─────────────────────────────────────────────────────────────────────────
      - name: Check Signing Credentials Availability
        id: sign_mode
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          WIDGET_PROVISION_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISION_PROFILE_BASE64 }}
        run: |
          echo "=================================================="
          echo " Checking Signing Credentials"
          echo "=================================================="

          if [ -n "$BUILD_CERTIFICATE_BASE64" ] && [ -n "$P12_PASSWORD" ] && [ -n "$BUILD_PROVISION_PROFILE_BASE64" ] && [ -n "$WIDGET_PROVISION_PROFILE_BASE64" ]; then
            echo "mode=signed_ci" >> $GITHUB_OUTPUT
            echo " [OK] All Apple Developer secrets found in GitHub Secrets."
            echo " -> Mode: Automatic GitHub Actions Apple Distribution Signing"
          else
            echo "mode=release_package" >> $GITHUB_OUTPUT
            echo " [INFO] GitHub Secrets not set. Building Production Release Package for your friend."
            echo " -> Mode: Production Release Build (IPA + Xcode Archive for TestFlight)"
          fi

      # ─────────────────────────────────────────────────────────────────────────
      # 3. Resolve App Version and Build Number
      # ─────────────────────────────────────────────────────────────────────────
      - name: Resolve App Version & Build
        id: versioning
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //g' | tr -d '[:space:]')
          PUBSPEC_NAME=$(echo "$PUBSPEC_VERSION" | cut -d'+' -f1)
          PUBSPEC_BUILD=$(echo "$PUBSPEC_VERSION" | cut -d'+' -f2)

          INPUT_NAME="${{ github.event.inputs.build_name }}"
          INPUT_BUILD="${{ github.event.inputs.build_number }}"

          FINAL_VERSION="${INPUT_NAME:-$PUBSPEC_NAME}"
          FINAL_BUILD="${INPUT_BUILD:-$PUBSPEC_BUILD}"

          ARTIFACT_BASE_NAME="Nada-iOS-v${FINAL_VERSION}-build${FINAL_BUILD}"

          echo "final_version=$FINAL_VERSION" >> $GITHUB_OUTPUT
          echo "final_build=$FINAL_BUILD" >> $GITHUB_OUTPUT
          echo "artifact_name=$ARTIFACT_BASE_NAME" >> $GITHUB_OUTPUT

          echo "=================================================="
          echo " Version: $FINAL_VERSION"
          echo " Build:   $FINAL_BUILD"
          echo " Artifact Base Name: $ARTIFACT_BASE_NAME"
          echo "=================================================="

      # ─────────────────────────────────────────────────────────────────────────
      # 4. Set up Environment (Java, Flutter, CocoaPods)
      # ─────────────────────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      # ─────────────────────────────────────────────────────────────────────────
      # PATH A: SIGNED VIA GITHUB SECRETS (When secrets are configured)
      # ─────────────────────────────────────────────────────────────────────────
      - name: Configure Apple Keychain and Import Certificate
        if: steps.sign_mode.outputs.mode == 'signed_ci'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KC_PASSWORD="${KEYCHAIN_PASSWORD:-$(uuidgen)}"
          echo "KC_PASSWORD=$KC_PASSWORD" >> $GITHUB_ENV

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution_cert.p12"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KC_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KC_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -o 'Apple Distribution:.*' | head -1 || true)
          if [ -z "$SIGNING_IDENTITY" ]; then
            SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -o 'iPhone Distribution:.*' | head -1 || true)
          fi

          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> $GITHUB_ENV
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

      - name: Install & Validate Provisioning Profiles
        if: steps.sign_mode.outputs.mode == 'signed_ci'
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          WIDGET_PROVISION_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          RUNNER_PP_RAW="$RUNNER_TEMP/runner_raw.mobileprovision"
          WIDGET_PP_RAW="$RUNNER_TEMP/widget_raw.mobileprovision"
          RUNNER_PLIST="$RUNNER_TEMP/runner_pp.plist"
          WIDGET_PLIST="$RUNNER_TEMP/widget_pp.plist"

          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$RUNNER_PP_RAW"
          echo "$WIDGET_PROVISION_PROFILE_BASE64" | base64 --decode -o "$WIDGET_PP_RAW"

          security cms -D -i "$RUNNER_PP_RAW" > "$RUNNER_PLIST"
          security cms -D -i "$WIDGET_PP_RAW" > "$WIDGET_PLIST"

          RUNNER_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_PLIST")
          RUNNER_TEAM=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$RUNNER_PLIST")
          WIDGET_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$WIDGET_PLIST")

          cp "$RUNNER_PP_RAW" "$HOME/Library/MobileDevice/Provisioning Profiles/${RUNNER_UUID}.mobileprovision"
          cp "$WIDGET_PP_RAW" "$HOME/Library/MobileDevice/Provisioning Profiles/${WIDGET_UUID}.mobileprovision"

          EXPORT_OPTIONS_PATH="$RUNNER_TEMP/ExportOptions.plist"
          python3 -c "
          import plistlib
          export_dict = {
              'destination': 'export',
              'method': 'app-store',
              'signingStyle': 'manual',
              'signingCertificate': 'Apple Distribution',
              'teamID': '$RUNNER_TEAM',
              'stripSwiftSymbols': True,
              'uploadSymbols': True,
              'manageAppVersionAndBuildNumber': False,
              'provisioningProfiles': {
                  'com.nada.nadaZikrakanm': '$RUNNER_UUID',
                  'com.nada.nadaZikrakanm.PrayerTimesWidget': '$WIDGET_UUID'
              }
          }
          with open('$EXPORT_OPTIONS_PATH', 'wb') as f:
              plistlib.dump(export_dict, f)
          "
          echo "EXPORT_OPTIONS_PATH=$EXPORT_OPTIONS_PATH" >> $GITHUB_ENV

      - name: Build Signed iOS IPA
        if: steps.sign_mode.outputs.mode == 'signed_ci'
        run: |
          VERSION="${{ steps.versioning.outputs.final_version }}"
          BUILD_NUM="${{ steps.versioning.outputs.final_build }}"

          flutter build ipa --release \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUM" \
            --export-options-plist="$EXPORT_OPTIONS_PATH"

          IPA_SRC=$(ls build/ios/ipa/*.ipa | head -n 1)
          FINAL_IPA="build/ios/ipa/${{ steps.versioning.outputs.artifact_name }}.ipa"
          mv "$IPA_SRC" "$FINAL_IPA"
          echo "FINAL_IPA_PATH=$FINAL_IPA" >> $GITHUB_ENV

      # ─────────────────────────────────────────────────────────────────────────
      # PATH B: DIRECT RELEASE BUILD (When secrets not in GitHub)
      # ─────────────────────────────────────────────────────────────────────────
      - name: Build iOS Release Bundle
        if: steps.sign_mode.outputs.mode == 'release_package'
        run: |
          VERSION="${{ steps.versioning.outputs.final_version }}"
          BUILD_NUM="${{ steps.versioning.outputs.final_build }}"

          echo "=================================================="
          echo " Building Production Release App for iOS..."
          echo "=================================================="
          flutter build ios --release --no-codesign \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUM"

          APP_SRC="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_SRC" ]; then
            echo "::error::Runner.app not found in build/ios/iphoneos!"
            exit 1
          fi

          # 1. Package Release IPA
          mkdir -p build/ios/ipa/Payload
          ditto "$APP_SRC" build/ios/ipa/Payload/Runner.app

          cd build/ios/ipa
          FINAL_IPA="${{ steps.versioning.outputs.artifact_name }}.ipa"
          zip -r -y "$FINAL_IPA" Payload
          rm -rf Payload
          cd ../../..

          echo "FINAL_IPA_PATH=nada-zikr/build/ios/ipa/$FINAL_IPA" >> $GITHUB_ENV

          # 2. Package standard Xcode Archive for TestFlight
          # This allows your friend to open it directly in Xcode Organizer and click 'Distribute App'
          ARCHIVE_DIR="build/ios/archive/Runner.xcarchive"
          mkdir -p "$ARCHIVE_DIR/Products/Applications"
          ditto "$APP_SRC" "$ARCHIVE_DIR/Products/Applications/Runner.app"

          # Create Archive Info.plist
          cat <<EOF > "$ARCHIVE_DIR/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>ApplicationProperties</key>
              <dict>
                  <key>ApplicationPath</key>
                  <string>Applications/Runner.app</string>
                  <key>CFBundleIdentifier</key>
                  <string>com.nada.nadaZikrakanm</string>
                  <key>CFBundleShortVersionString</key>
                  <string>$VERSION</string>
                  <key>CFBundleVersion</key>
                  <string>$BUILD_NUM</string>
                  <key>SigningIdentity</key>
                  <string></string>
                  <key>Team</key>
                  <string></string>
              </dict>
              <key>ArchiveVersion</key>
              <integer>2</integer>
              <key>CreationDate</key>
              <date>$(date -u +"%Y-%m-%dT%H:%M:%SZ")</date>
              <key>Name</key>
              <string>Runner</string>
              <key>SchemeName</key>
              <string>Runner</string>
          </dict>
          </plist>
          EOF

      # ─────────────────────────────────────────────────────────────────────────
      # 5. Build Integrity Validation
      # ─────────────────────────────────────────────────────────────────────────
      - name: Validate Release Package Integrity
        run: |
          FINAL_IPA=$(ls build/ios/ipa/*.ipa | head -n 1)
          echo "=================================================="
          echo " Validating Release Package: $FINAL_IPA"
          echo "=================================================="

          FILE_SIZE=$(stat -f%z "$FINAL_IPA")
          echo "IPA File Size: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "::error::IPA file is smaller than 1 MB! Build may be corrupt."
            exit 1
          fi

          VERIFY_DIR="$RUNNER_TEMP/verify_ipa"
          mkdir -p "$VERIFY_DIR"
          unzip -q "$FINAL_IPA" -d "$VERIFY_DIR"

          APP_PATH="$VERIFY_DIR/Payload/Runner.app"
          APP_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          APP_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist")
          APP_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Info.plist")

          echo "Bundle Identifier: $APP_BUNDLE_ID"
          echo "App Version:       $APP_VER"
          echo "App Build Number:  $APP_BUILD"

          if [ "$APP_BUNDLE_ID" != "com.nada.nadaZikrakanm" ]; then
            echo "::error::Unexpected Bundle Identifier '$APP_BUNDLE_ID'!"
            exit 1
          fi

          # Verify WidgetKit extension is present
          WIDGET_PATH="$APP_PATH/PlugIns/PrayerTimesWidgetExtension.appex"
          if [ ! -d "$WIDGET_PATH" ]; then
            echo "::error::PrayerTimesWidgetExtension.appex is missing from PlugIns!"
            exit 1
          fi
          echo " [OK] PrayerTimesWidgetExtension.appex is verified inside IPA."

          # Verify binary architecture
          ARCHS=$(lipo -info "$APP_PATH/Runner")
          echo "Binary Architectures: $ARCHS"
          if [[ "$ARCHS" != *"arm64"* ]]; then
            echo "::error::Runner binary is missing arm64 architecture!"
            exit 1
          fi
          echo " [OK] arm64 device architecture verified."

          echo "=================================================="
          echo " BUILD VALIDATION PASSED!"
          echo "=================================================="

      # ─────────────────────────────────────────────────────────────────────────
      # 6. Package & Upload GitHub Artifacts
      # ─────────────────────────────────────────────────────────────────────────
      - name: Zip xcarchive for Xcode Organizer
        run: |
          if [ -d "build/ios/archive/Runner.xcarchive" ]; then
            cd build/ios/archive
            zip -r -q "Runner.xcarchive.zip" Runner.xcarchive
            cd ../../..
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.versioning.outputs.artifact_name }}
          path: nada-zikr/build/ios/ipa/*.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload xcarchive Artifact (For Xcode Organizer)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.versioning.outputs.artifact_name }}-xcarchive
          path: nada-zikr/build/ios/archive/Runner.xcarchive.zip
          retention-days: 14
          if-no-files-found: ignore

      # ─────────────────────────────────────────────────────────────────────────
      # 7. Optional Direct TestFlight Upload
      # ─────────────────────────────────────────────────────────────────────────
      - name: Upload to App Store Connect / TestFlight
        if: ${{ steps.sign_mode.outputs.mode == 'signed_ci' && inputs.upload_testflight == true && env.APPSTORE_PRIVATE_KEY != '' }}
        uses: apple-actions/upload-testflight-build@v1
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        with:
          app-path: ${{ env.FINAL_IPA_PATH }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      # ─────────────────────────────────────────────────────────────────────────
      # 8. Cleanup Keychain & Temp Files
      # ─────────────────────────────────────────────────────────────────────────
      - name: Clean up temporary files
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -rf "$RUNNER_TEMP"/* || true
