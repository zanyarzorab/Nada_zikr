name: Flutter iOS Release

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Flutter iOS IPA
    runs-on: macos-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. SETUP FLUTTER
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Flutter doctor
        run: flutter doctor -v

      # ============================================================
      # 3. GET DEPENDENCIES
      # ============================================================
      - name: Get Flutter dependencies
        run: flutter pub get

      # ============================================================
      # 4. INSPECT IOS PROJECT
      # ============================================================
      - name: Inspect iOS project
        run: |
          echo "=================================================="
          echo "IOS DIRECTORY"
          echo "=================================================="
          ls -la ios

          echo ""
          echo "=================================================="
          echo "PODFILE"
          echo "=================================================="

          if [ -f ios/Podfile ]; then
            cat ios/Podfile
          else
            echo "WARNING: ios/Podfile not found"
          fi

          echo ""
          echo "=================================================="
          echo "ENTITLEMENT FILES"
          echo "=================================================="

          find ios -name "*.entitlements" -print || true

          echo ""
          echo "=================================================="
          echo "APP GROUP REFERENCES"
          echo "=================================================="

          grep -Rni \
            "com.apple.security.application-groups\|group\." \
            ios \
            --include="*.entitlements" \
            --include="project.pbxproj" \
            --include="*.plist" \
            || true

      # ============================================================
      # 5. GENERATE IOS CONFIGURATION
      # ============================================================
      - name: Generate iOS configuration
        run: |
          flutter build ios \
            --config-only \
            --no-codesign

      # ============================================================
      # 6. VERIFY XCODE WORKSPACE
      # ============================================================
      - name: Verify iOS workspace
        run: |
          echo "=================================================="
          echo "VERIFYING XCODE WORKSPACE"
          echo "=================================================="

          test -d ios/Runner.xcworkspace

          echo "Runner.xcworkspace exists."

          echo ""
          echo "=================================================="
          echo "IOS PROJECT"
          echo "=================================================="

          ls -la ios

      # ============================================================
      # 7. SHOW XCODE TARGETS
      # ============================================================
      - name: Inspect Xcode targets
        run: |
          echo "=================================================="
          echo "XCODE TARGETS"
          echo "=================================================="

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -list

      # ============================================================
      # 8. BUILD IOS RELEASE
      # ============================================================
      - name: Build iOS
        run: |
          echo "=================================================="
          echo "BUILDING IOS RELEASE"
          echo "=================================================="

          flutter build ios \
            --release \
            --no-codesign

      # ============================================================
      # 9. VERIFY BUILD OUTPUT
      # ============================================================
      - name: Verify build output
        run: |
          echo "=================================================="
          echo "BUILD OUTPUT"
          echo "=================================================="

          ls -lah build/ios/iphoneos/

          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            echo ""
            echo "SUCCESS: Runner.app was created."
          else
            echo ""
            echo "ERROR: Runner.app was NOT created."
            exit 1
          fi

      # ============================================================
      # 10. FIND WIDGET EXTENSION
      # ============================================================
      - name: Find Widget Extension
        run: |
          echo "=================================================="
          echo "WIDGET / EXTENSION FILES"
          echo "=================================================="

          find ios \
            \( -iname "*widget*" -o -iname "*extension*" \) \
            -print \
            || true

      # ============================================================
      # 11. CHECK EMBEDDED EXTENSIONS
      # ============================================================
      - name: Verify embedded Widget Extension
        run: |
          echo "=================================================="
          echo "EMBEDDED EXTENSIONS"
          echo "=================================================="

          if [ -d "build/ios/iphoneos/Runner.app/PlugIns" ]; then

            echo "SUCCESS: PlugIns directory exists."

            echo ""
            echo "Contents:"
            find \
              build/ios/iphoneos/Runner.app/PlugIns \
              -maxdepth 3 \
              -print

          else

            echo "WARNING: No PlugIns directory found."
            echo "If your app contains a Widget Extension,"
            echo "this requires investigation."

          fi

      # ============================================================
      # 12. CHECK APP GROUPS
      # ============================================================
      - name: Check App Groups
        run: |
          echo "=================================================="
          echo "APP GROUP ENTITLEMENTS"
          echo "=================================================="

          FOUND=0

          while IFS= read -r file; do

            echo ""
            echo "--------------------------------------------------"
            echo "$file"
            echo "--------------------------------------------------"

            if grep -n \
              "com.apple.security.application-groups" \
              "$file"; then

              FOUND=1

              grep -A10 \
                "com.apple.security.application-groups" \
                "$file"

            fi

          done < <(
            find ios \
              -name "*.entitlements" \
              -print
          )

          echo ""

          if [ "$FOUND" -eq 0 ]; then
            echo "WARNING:"
            echo "No App Group entitlement was found."
          else
            echo "SUCCESS: App Group entitlement found."
          fi

      # ============================================================
      # 13. CHECK SHARED DATA CODE
      # ============================================================
      - name: Check shared data implementation
        run: |
          echo "=================================================="
          echo "SHARED DATA REFERENCES"
          echo "=================================================="

          grep -Rni \
            "UserDefaults(suiteName:\|suiteName:\|applicationGroups\|group\." \
            ios \
            --include="*.swift" \
            --include="*.m" \
            --include="*.mm" \
            --include="*.h" \
            --include="*.dart" \
            || true

      # ============================================================
      # 14. CHECK BUNDLE ID
      # ============================================================
      - name: Check application identity
        run: |
          echo "=================================================="
          echo "BUNDLE INFORMATION"
          echo "=================================================="

          echo ""
          echo "Bundle ID:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            build/ios/iphoneos/Runner.app/Info.plist

          echo ""
          echo "Bundle Name:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleName" \
            build/ios/iphoneos/Runner.app/Info.plist

          echo ""
          echo "Display Name:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleDisplayName" \
            build/ios/iphoneos/Runner.app/Info.plist

      # ============================================================
      # 15. INSPECT RUNNER.APP
      # ============================================================
      - name: Inspect Runner.app
        run: |
          echo "=================================================="
          echo "RUNNER.APP CONTENTS"
          echo "=================================================="

          find \
            build/ios/iphoneos/Runner.app \
            -maxdepth 3 \
            -print \
            | head -250

      # ============================================================
      # 16. CREATE PROPER IPA
      # ============================================================
      - name: Create IPA
        run: |
          echo "=================================================="
          echo "CREATING IPA"
          echo "=================================================="

          rm -rf Payload
          rm -f zikrakan.ipa

          mkdir -p Payload

          cp -R \
            build/ios/iphoneos/Runner.app \
            Payload/Runner.app

          echo ""
          echo "=================================================="
          echo "PAYLOAD"
          echo "=================================================="

          ls -lah Payload

          echo ""
          echo "Runner.app:"
          ls -lah Payload/Runner.app | head -40

          echo ""
          echo "=================================================="
          echo "CREATING ZIP"
          echo "=================================================="

          zip -r -9 \
            zikrakan.ipa \
            Payload

          echo ""
          echo "=================================================="
          echo "IPA CREATED"
          echo "=================================================="

          ls -lh zikrakan.ipa

      # ============================================================
      # 17. VERIFY IPA
      # ============================================================
      - name: Verify IPA
        run: |
          echo "=================================================="
          echo "VERIFYING IPA"
          echo "=================================================="

          if [ ! -f "zikrakan.ipa" ]; then
            echo "ERROR: zikrakan.ipa does not exist."
            exit 1
          fi

          echo "IPA file exists."

          echo ""
          echo "=================================================="
          echo "IPA CONTENTS"
          echo "=================================================="

          unzip -l zikrakan.ipa | head -120

          echo ""
          echo "=================================================="
          echo "VERIFY PAYLOAD"
          echo "=================================================="

          if unzip -l zikrakan.ipa | grep -E "Payload/Runner\.app(/|$)" > /dev/null; then

            echo "SUCCESS: Payload/Runner.app found!"

          else

            echo "ERROR: Payload/Runner.app NOT found!"

            echo ""
            echo "Searching for Runner.app:"
            unzip -l zikrakan.ipa | grep "Runner.app" | head -50

            exit 1

          fi

          echo ""
          echo "=================================================="
          echo "VERIFY WIDGET EXTENSION IN IPA"
          echo "=================================================="

          if unzip -l zikrakan.ipa | grep -q "PlugIns/"; then

            echo "SUCCESS: PlugIns directory found."

            echo ""
            echo "Widget/plugin contents:"
            unzip -l zikrakan.ipa | grep "PlugIns/" | head -100

          else

            echo "WARNING: No PlugIns directory found."
            echo "If your project contains a Widget Extension,"
            echo "the extension may not be embedded."
          fi

      # ============================================================
      # 18. UPLOAD IPA
      # ============================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: zikrakan-iOS
          path: zikrakan.ipa
          if-no-files-found: error
