name: Flutter Android Release

# Triggers:
#   - Push a semver tag (e.g. v1.0.0) → full build + Play Store upload
#   - Manual trigger from the Actions tab (workflow_dispatch)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-android:
    name: Build & Upload Android AAB
    runs-on: ubuntu-latest

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Flutter ──────────────────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2" # Pinned — update intentionally
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # ── 3. Java (required for Gradle signing) ───────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ── 4. Signing keystore ─────────────────────────────────────────────────
      # Store the keystore as a base64 GitHub Secret:
      #   base64 nada-release.jks | tr -d '\n'   → copy to KEYSTORE_BASE64 secret
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/nada-release.jks
          echo "Keystore decoded ✓"

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=nada-key
          storeFile=../nada-release.jks
          EOF
          echo "key.properties written ✓"

      # ── 5. Dependencies ─────────────────────────────────────────────────────
      - name: Get Flutter dependencies
        run: flutter pub get

      # ── 6. Static analysis ──────────────────────────────────────────────────
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      # ── 7. Tests ────────────────────────────────────────────────────────────
      - name: Flutter test
        run: flutter test

      # ── 8. Build release AAB ─────────────────────────────────────────────────
      - name: Build release AAB
        run: |
          flutter build appbundle \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info
          echo "================================"
          echo "AAB BUILD COMPLETE"
          echo "================================"
          ls -lh build/app/outputs/bundle/release/

      # ── 9. Upload AAB artifact ───────────────────────────────────────────────
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: nada-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # ── 10. Upload debug symbols ─────────────────────────────────────────────
      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: nada-debug-symbols
          path: build/debug-info/
          if-no-files-found: warn
          retention-days: 30

      # ── 11. Upload to Play Store ─────────────────────────────────────────────
      # Requires SERVICE_ACCOUNT_JSON secret (base64-encoded service account key).
      # Comment out this step if you prefer manual uploads via Play Console.
      # Track options: internal | alpha | beta | production
      - name: Upload to Play Store (Internal Testing)
        # Only upload on tag pushes, not on manual workflow_dispatch
        if: startsWith(github.ref, 'refs/tags/v')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.nada.zikrakanm
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          # whatsNewDirectory: distribution/whatsnew   # optional release notes folder
